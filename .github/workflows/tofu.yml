name: OpenTofu

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan from this run (default: plan only)"
        required: true
        default: false
        type: boolean

concurrency:
  group: opentofu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Setup mise
        uses: jdx/mise-action@v4.2.0
      - name: Check
        run: mise run check

  plan:
    name: Manual plan
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "1"
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
      TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_private_key_path: ${{ github.workspace }}/oci_api_key.pem
      TF_VAR_region: ${{ secrets.OCI_REGION }}
      TF_VAR_ssh_public_key: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      CF_API_EMAIL: ${{ secrets.CF_API_EMAIL }}
      TF_VAR_cloudflare_api_key: ${{ secrets.CF_API_KEY }}
      TF_VAR_cloudflare_email: ${{ secrets.CF_API_EMAIL }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_vaultwarden_hostname: ${{ secrets.VAULTWARDEN_HOSTNAME }}
      TF_VAR_agent_flow_repo_url: ${{ secrets.AGENT_FLOW_REPO_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Setup mise
        uses: jdx/mise-action@v4.2.0
      - name: Require main for manual apply
        if: ${{ inputs.apply == true && github.ref != 'refs/heads/main' }}
        run: |
          echo 'Manual apply is allowed only from main.' >&2
          exit 1
      - name: Create private OCI key and backend config
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          umask 077
          printf '%s\n' "$OCI_PRIVATE_KEY" > oci_api_key.pem
          printf 'endpoints = { s3 = "https://%s.r2.cloudflarestorage.com" }\n' "$R2_ACCOUNT_ID" > backend.hcl
      - name: OpenTofu init
        run: |
          umask 077
          mkdir -p .private
          chmod 700 .private
          if ! mise run ci-init > .private/ci-init.log 2>&1; then
            echo 'OpenTofu init failed. Private log: .private/ci-init.log' >&2
            exit 1
          fi
      - name: OpenTofu plan
        run: |
          set +e
          scripts/ci_plan.sh
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then
            exit 1
          fi
          if [ "$status" -eq 2 ] && [ "${{ inputs.apply }}" != "true" ]; then
            exit 2
          fi
      - name: Apply this run's saved plan
        if: ${{ inputs.apply == true && github.ref == 'refs/heads/main' }}
        run: scripts/ci_apply.sh
